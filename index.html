<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Money Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080a0e;color:#eef1f5;font:14px Inter,system-ui,sans-serif}
main{max-width:1180px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}
h1{font-size:30px;margin:0 0 5px}.muted{color:#7f8898}.pill{padding:6px 10px;border:1px solid #29303b;border-radius:99px}
.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.card{background:#11151c;border:1px solid #232a35;border-radius:16px;padding:18px;margin-bottom:18px}
h2{font-size:17px;margin:0 0 14px}input,button{background:#0b0e13;border:1px solid #303845;color:#fff;border-radius:9px;padding:10px}
button{cursor:pointer}.add{display:flex;gap:8px}.add input:first-child{flex:1}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid #202630}th{color:#7f8898;font-weight:500}
.score{font-weight:800}.buy{color:#55e6a0}.sell{color:#ff7787}.empty{text-align:center;padding:28px;color:#7f8898}
.stat{display:inline-block;margin-right:22px}.stat b{font-size:20px;display:block}
@media(max-width:800px){.grid{grid-template-columns:1fr}.top{display:block}.add{flex-wrap:wrap}}
</style></head>
<body><main>
<div class="top"><div><h1>⚡ Smart Money</h1><div class="muted">Solana trader intelligence · Pump.fun/PumpSwap</div></div><div class="pill" id="status">Connecting…</div></div>
<div class="card">
 <h2>Track a trader</h2>
 <div class="add"><input id="address" placeholder="Solana wallet address"><input id="label" placeholder="Label (optional)"><button onclick="addWallet()">Track wallet</button></div>
</div>
<div class="grid">
<section class="card"><h2>Leaderboard</h2><div id="summary"></div><table><thead><tr><th>Trader</th><th>Score</th><th>Observed P&L</th><th>Trades</th></tr></thead><tbody id="wallets"></tbody></table></section>
<section class="card"><h2>Live activity</h2><table><thead><tr><th>Side</th><th>Wallet</th><th>SOL</th><th>Token</th></tr></thead><tbody id="trades"></tbody></table></section>
</div>
<section class="card"><h2>🎯 Launch screener <span class="muted" style="font-weight:400;font-size:12px">— heuristic momentum score, not a profit guarantee</span></h2>
<table><thead><tr><th>Token</th><th>Score</th><th>Buyers</th><th>Buy/Sell SOL</th><th>MCap (SOL)</th><th>Contract</th></tr></thead><tbody id="launches"></tbody></table></section>
</main>
<script>
const $=x=>document.querySelector(x);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function addWallet(){
 const address=$('#address').value.trim(),label=$('#label').value.trim();
 const r=await fetch('/api/wallets',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({address,label})});
 if(r.ok){$('#address').value='';$('#label').value='';load()}
}
async function load(){
 try{
  const [w,t,l]=await Promise.all([fetch('/api/wallets').then(r=>r.json()),fetch('/api/trades').then(r=>r.json()),fetch('/api/launches').then(r=>r.json())]);
  $('#status').textContent='● Live';
  $('#summary').innerHTML=`<span class="stat"><b>${w.length}</b><span class="muted">tracked</span></span><span class="stat"><b>${t.length}</b><span class="muted">recent events</span></span>`;
  $('#wallets').innerHTML=w.length?w.map(x=>`<tr><td>${esc(x.label||x.address.slice(0,6)+'…'+x.address.slice(-4))}</td><td class="score">${x.score}</td><td>${Number(x.realized_pnl_sol).toFixed(2)} SOL</td><td>${x.trades}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">Add your first wallet above.</td></tr>';
  $('#trades').innerHTML=t.slice(0,60).map(x=>`<tr><td class="${x.side}">${x.side}</td><td>${esc(x.wallet.slice(0,5))}…</td><td>${Number(x.sol_amount).toFixed(3)}</td><td>${esc(x.mint.slice(0,6))}…</td></tr>`).join('');
  const sorted=l.slice().sort((a,b)=>b.score-a.score);
  $('#launches').innerHTML=sorted.length?sorted.slice(0,60).map(x=>`<tr><td>${esc(x.symbol?('$'+x.symbol):(x.name||'—'))}</td><td class="score">${x.score}</td><td>${x.unique_buyers}</td><td>${Number(x.buy_sol).toFixed(2)} / ${Number(x.sell_sol).toFixed(2)}</td><td>${Number(x.last_market_cap_sol).toFixed(1)}</td><td><a style="color:#7fb8ff" href="https://pump.fun/coin/${x.mint}" target="_blank">${esc(x.mint.slice(0,6))}…</a></td></tr>`).join(''):'<tr><td colspan="6" class="empty">Watching for new launches…</td></tr>';
 }catch{$('#status').textContent='● Offline'}
}
load();setInterval(load,3000);
</script></body></html>
